<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brodies Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:#f9f7f3;color:#1a1a18;font-weight:300;min-height:100vh}

/* LOGIN */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.5rem}
#login h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:600;letter-spacing:.06em}
#login input{padding:.8rem 1.2rem;border:1px solid #ddd;width:280px;font-family:'Jost',sans-serif;font-size:1rem}
#login button{padding:.8rem 2rem;background:#1a1a18;color:#f9f7f3;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;width:280px}
#login-err{color:#8b2a2a;font-size:.8rem;display:none}

/* APP */
#app{display:none}
header{position:sticky;top:0;z-index:100;background:rgba(249,247,243,.96);backdrop-filter:blur(6px);border-bottom:1px solid #e0ddd8;padding:.7rem 1.5rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
header h1{font-family:'Cormorant Garamond',serif;font-size:.95rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
#trip-sel{padding:.45rem .7rem;border:1px solid #ddd;background:white;font-family:'Jost',sans-serif;font-size:.85rem;min-width:200px;cursor:pointer}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:.8rem}
#save-btn{padding:.55rem 1.4rem;background:#8b3a2a;color:white;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.35;pointer-events:none}
#save-btn.active{opacity:1;pointer-events:auto}
#save-msg{font-size:.72rem;color:#2a6b3a;display:none;white-space:nowrap}
#view-link{font-size:.72rem;color:#7a7a72;text-decoration:underline;display:none}

/* MAIN */
.wrap{max-width:1080px;margin:0 auto;padding:1.2rem 1.5rem 8rem}
#status-row{display:none;align-items:center;gap:1rem;padding:.6rem 0;margin-bottom:1rem;border-bottom:1px solid #e0ddd8}
.tog{position:relative;width:36px;height:20px}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;background:#ccc;border-radius:20px;cursor:pointer;transition:.2s}
.tog-track:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
input:checked+.tog-track{background:#2a6b3a}
input:checked+.tog-track:before{transform:translateX(16px)}
#live-lbl{font-size:.8rem;color:#7a7a72}

/* TOOLBAR */
#toolbar{display:none;margin-bottom:1.2rem;padding:.8rem;background:white;border:1px solid #e0ddd8;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
#toolbar{display:none}
.upload-zone{border:2px dashed #e0ddd8;padding:.8rem 1.2rem;text-align:center;cursor:pointer;flex:1;min-width:200px;transition:.2s}
.upload-zone:hover,.upload-zone.over{border-color:#8b3a2a;background:#f3ebe9}
.upload-zone p{font-size:.75rem;color:#7a7a72}
#file-inp{display:none}
.sec-inp{padding:.5rem .8rem;border:1px solid #ddd;font-family:'Cormorant Garamond',serif;font-size:1.1rem;flex:1;min-width:160px}
.btn-ghost{padding:.5rem 1rem;border:1px solid #ddd;background:transparent;cursor:pointer;font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#7a7a72;white-space:nowrap}
.btn-ghost:hover{border-color:#8b3a2a;color:#8b3a2a}

/* NOTICE */
#notice{display:none;padding:.6rem 1rem;font-size:.8rem;margin-bottom:1rem;border-left:3px solid #8b3a2a;background:#f3ebe9}
#notice.ok{border-color:#2a6b3a;background:#e9f3eb}
#notice.err{border-color:#8b2a2a;background:#f3e9e9}

/* SECTIONS */
.sec-block{margin-bottom:2rem}
.sec-hdr{display:flex;align-items:center;gap:.8rem;border-bottom:2px solid #e0ddd8;padding-bottom:.4rem;margin-bottom:.8rem}
.sec-name{flex:1;border:none;background:transparent;font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;color:#1a1a18;letter-spacing:.03em}
.sec-name:focus{outline:none;border-bottom:2px solid #8b3a2a}
.sec-count{font-size:.68rem;color:#7a7a72;letter-spacing:.08em;white-space:nowrap}
.btn-del-sec{padding:.35rem .8rem;background:#8b2a2a;color:white;border:none;cursor:pointer;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

/* GRID */
.photo-grid-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px}
.add-tile{border:2px dashed #e0ddd8;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#aaa;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;gap:.3rem;transition:.2s}
.add-tile:hover{border-color:#8b3a2a;color:#8b3a2a;background:#f3ebe9}
.add-tile span.plus{font-size:1.8rem;font-weight:300;opacity:.5}

/* PHOTO CARD */
.pcard{position:relative;cursor:pointer;border:2px solid transparent;transition:border-color .15s;background:white}
.pcard:hover{border-color:#8b3a2a}
.pcard.sel{border-color:#8b3a2a;box-shadow:0 0 0 2px #8b3a2a}
.pcard.dragging{opacity:.25}
.pcard.dragover{border-color:#2a4a8b!important;border-style:dashed!important}
.pcard img{width:100%;height:115px;object-fit:cover;display:block}
.pcard img.err{opacity:.2;filter:grayscale(1)}
.cap-bar{font-size:.62rem;padding:3px 5px;height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#faf9f7;color:#aaa}
.cap-bar.has{color:#1a1a18}
.drag-dot{position:absolute;bottom:22px;left:3px;color:rgba(255,255,255,.75);font-size:.85rem;cursor:grab;user-select:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.del-btn{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:white;border:none;cursor:pointer;width:20px;height:20px;font-size:.75rem;display:none;align-items:center;justify-content:center;border-radius:2px}
.pcard:hover .del-btn{display:flex}
.new-badge{position:absolute;top:3px;left:3px;background:#2a6b3a;color:white;font-size:.5rem;letter-spacing:.07em;text-transform:uppercase;padding:2px 4px}

/* EDIT PANEL */
#panel{position:fixed;bottom:0;left:0;right:0;z-index:200;background:white;border-top:2px solid #8b3a2a;padding:.9rem 1.5rem;display:none;align-items:center;gap:1.2rem;box-shadow:0 -4px 18px rgba(0,0,0,.1);flex-wrap:wrap}
#panel.open{display:flex}
#panel-img{width:72px;height:58px;object-fit:cover;border:1px solid #ddd;flex-shrink:0}
#panel-file{font-size:.58rem;color:#aaa;margin-top:2px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf{display:flex;flex-direction:column;gap:.25rem}
.pf label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#aaa}
#panel-sec{padding:.4rem .6rem;border:1px solid #ddd;background:white;font-family:'Jost',sans-serif;font-size:.82rem;cursor:pointer;min-width:150px}
#panel-cap{padding:.4rem .6rem;border:1px solid #ddd;font-family:'Jost',sans-serif;font-size:.82rem;resize:none;height:34px;width:320px;background:#f9f7f3}
#panel-cap:focus,#panel-sec:focus{outline:2px solid #8b3a2a;background:white}
#panel-close{background:none;border:none;cursor:pointer;font-size:1.4rem;color:#aaa;margin-left:auto;align-self:flex-start}
#panel-close:hover{color:#1a1a18}

.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>The Brodies</h1>
  <p style="font-size:.75rem;letter-spacing:.1em;color:#7a7a72;text-transform:uppercase">Site Admin</p>
  <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Enter</button>
  <div id="login-err">Incorrect password</div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>Brodies Admin</h1>
    <select id="trip-sel" onchange="loadTrip()">
      <option value="">— Select a trip —</option>
    </select>
    <div id="hdr-right">
      <a id="view-link" href="#" target="_blank">View live ↗</a>
      <span id="save-msg">✓ Published</span>
      <button id="save-btn" onclick="doSave()">Save &amp; Publish</button>
    </div>
  </header>

  <div class="wrap">
    <div id="notice"></div>

    <div id="status-row">
      <label class="tog"><input type="checkbox" id="live-tog" onchange="toggleLive()"><span class="tog-track"></span></label>
      <span id="live-lbl">Planning</span>
    </div>

    <div id="toolbar">
      <div class="upload-zone" id="drop-zone"
        onclick="document.getElementById('file-inp').click()"
        ondragover="ev.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="this.classList.remove('over');handleFiles(event.dataTransfer.files,null);event.preventDefault()">
        <p>Drop photos here or click to browse</p>
        <p style="font-size:.65rem;margin-top:.2rem;color:#bbb">Photos go to the last section unless you use the section's + tile</p>
      </div>
      <input type="file" id="file-inp" multiple accept="image/*" onchange="handleFiles(this.files,null);this.value=''">
      <input class="sec-inp" id="sec-inp" placeholder="New section (e.g. Paris)…" onkeydown="if(event.key==='Enter')addSection()">
      <button class="btn-ghost" onclick="addSection()">+ Add Section</button>
    </div>

    <div id="editor"></div>
  </div>
</div>

<!-- EDIT PANEL -->
<div id="panel">
  <div style="flex-shrink:0">
    <img id="panel-img" src="" alt="">
    <div id="panel-file"></div>
  </div>
  <div class="pf">
    <label>Section</label>
    <select id="panel-sec" onchange="panelSecChange()"></select>
  </div>
  <div class="pf">
    <label>Caption / Note</label>
    <textarea id="panel-cap" placeholder="Add a caption…" oninput="panelCapInput()"></textarea>
  </div>
  <button id="panel-close" onclick="closePanel()">×</button>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
var REPO = '3crotonlake/thebrodies.com';
var PW   = '10520';
var TOK  = ['ghp_D7r6L5','5hqPWTQkSD','1M3FWAYzAL','Qj773Cq4hq'].join('');
var HOOK = 'https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/2a328602-f7bb-476d-9cd3-7b07d570bad7';

var TRIPS = [
  {v:'london-oxford-paris-2025',   l:'London / Oxford / Paris 2025',   f:'2025_london-oxford-paris'},
  {v:'edinburgh-york-london-2026', l:'Edinburgh / York / London 2026',  f:'2026_edinburgh'},
  {v:'iceland-2026',               l:'Iceland 2026 (Girls Trip)',       f:'2026_iceland'},
  {v:'memphis-2026',               l:'Memphis 2026',                    f:'2026_Memphis'},
  {v:'oxford-2026',                l:'Oxford 2026',                     f:'2026_oxford'},
  {v:'switzerland-sweden-2025',    l:'Switzerland & Sweden 2025',       f:'2025_switzerland-sweden'},
  {v:'utah-2025',                  l:'Utah 2025 (Mighty 5)',            f:'2025_utah'},
  {v:'florence-rome-2025',         l:'Florence / Rome 2025',            f:'2025_FlorenceRome'},
  {v:'charleston-2025',            l:'Charleston 2025',                 f:'2025_charleston'},
  {v:'belize-2025',                l:'Belize 2025',                     f:'2025_Belize'},
  {v:'cambodia-2024',              l:'Cambodia 2024',                   f:'2024_cambodia'},
  {v:'ireland-2024',               l:'Ireland 2024',                    f:'2024_ireland'},
  {v:'mont-tremblant-2024',        l:'Mont Tremblant 2024',             f:'2024_MontTremblant'},
  {v:'sedona-2023',                l:'Sedona & Grand Canyon 2023',      f:'2023_sedona'},
  {v:'puerto-rico-2023',           l:'Puerto Rico 2023',                f:'2023_PuertoRico'},
  {v:'thailand-cambodia-2023',     l:'Thailand & Cambodia 2023',        f:'2023_thailand-cambodia'},
  {v:'london-2022',                l:'London 2022',                     f:'2022_london'},
  {v:'spain-portugal-2022',        l:'Spain & Portugal 2022',           f:'2022_spain-portugal'},
  {v:'acadia-2021',                l:'Acadia 2021',                     f:'2021_acadia'},
  {v:'spain-2019',                 l:'Spain 2019',                      f:'2019_spain'}
];

// ── STATE ─────────────────────────────────────────────────────────
var trip = null, tripFolder = null, tripSHA = '', tripHTML = '';
var sections = []; // [{name, photos:[{src,caption,isNew}]}]
var dirty = false;
var sel = null; // {si,pi} selected card
var drag = null;

// ── BOOT ──────────────────────────────────────────────────────────
window.onload = function() {
  buildDropdown();
  if (localStorage.getItem('ba') === '1') {
    showApp();
    var lt = localStorage.getItem('bt');
    if (lt) { document.getElementById('trip-sel').value = lt; if (document.getElementById('trip-sel').value === lt) loadTrip(); }
  }
};
window.onbeforeunload = function() { if (dirty) return 'Unsaved changes — Save & Publish first.'; };

function buildDropdown() {
  var s = document.getElementById('trip-sel');
  TRIPS.forEach(function(t) {
    var o = document.createElement('option'); o.value = t.v; o.textContent = t.l; s.appendChild(o);
  });
}

function doLogin() {
  if (document.getElementById('pw').value === PW) {
    localStorage.setItem('ba','1'); showApp();
  } else { document.getElementById('login-err').style.display='block'; }
}
function showApp() {
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
}

// ── LOAD TRIP ─────────────────────────────────────────────────────
async function loadTrip() {
  var v = document.getElementById('trip-sel').value;
  if (!v) return;
  trip = v;
  var info = TRIPS.find(function(t){return t.v===v;});
  tripFolder = info ? info.f : v;
  localStorage.setItem('bt', v);
  closePanel(); dirty = false; setSaveDirty(false);

  var url = '/trips/'+v+'.html';
  document.getElementById('view-link').href = url;
  document.getElementById('view-link').style.display = 'inline';
  document.getElementById('editor').innerHTML = '<p style="padding:2rem;color:#aaa;font-size:.85rem">Loading…</p>';
  document.getElementById('status-row').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  hideNotice();

  try {
    var d = await ghGet('trips/'+v+'.html');
    tripSHA = d.sha;
    tripHTML = atob64(d.content);
    sections = parseHTML(tripHTML);
    render();
    setLiveToggle(tripHTML);
    document.getElementById('status-row').style.display = 'flex';
    document.getElementById('toolbar').style.display = 'flex';
  } catch(e) { showNotice('Could not load trip: '+e.message, 'err'); document.getElementById('editor').innerHTML=''; }
}

// ── PARSE HTML ────────────────────────────────────────────────────
function parseHTML(html) {
  var doc = new DOMParser().parseFromString(html,'text/html');
  var result = [], cur = null;
  doc.body.querySelectorAll('h2.city-name, div.photo-grid').forEach(function(el) {
    if (el.tagName==='H2') {
      cur = {name:el.textContent.trim(), photos:[]};
      result.push(cur);
    } else if (el.tagName==='DIV') {
      if (!cur) { cur={name:null,photos:[]}; result.push(cur); }
      el.querySelectorAll('.photo-item').forEach(function(item) {
        var img = item.querySelector('img');
        if (!img||!img.getAttribute('src')) return;
        var capEl = item.querySelector('p.photo-caption,figcaption');
        var cap = capEl ? capEl.textContent.trim() : (img.getAttribute('alt')||'');
        cur.photos.push({src:img.getAttribute('src'), caption:cap, isNew:false});
      });
    }
  });
  return result;
}

// ── BUILD HTML ────────────────────────────────────────────────────
function buildHTML() {
  var body = '';
  sections.forEach(function(sec) {
    if (sec.name) body += '<h2 class="city-name">'+esc(sec.name)+'</h2>\n';
    if (sec.photos.length) {
      body += '<div class="photo-grid">\n';
      sec.photos.forEach(function(p) {
        body += '<div class="photo-item"><img src="'+p.src+'" alt="'+esc(p.caption)+'" loading="lazy">';
        if (p.caption) body += '<p class="photo-caption">'+esc(p.caption)+'</p>';
        body += '</div>\n';
      });
      body += '</div>\n';
    }
  });

  // Find end of hero div (depth tracking)
  var heroStart = tripHTML.indexOf('<div class="hero">');
  var pos = heroStart, depth = 0, heroEnd = -1;
  while (pos < tripHTML.length && heroEnd < 0) {
    if (tripHTML.substr(pos,4)==='<div') depth++;
    else if (tripHTML.substr(pos,6)==='</div>') { depth--; if(depth===0) heroEnd = pos+6; }
    pos++;
  }
  var footerStart = tripHTML.indexOf('<footer');
  if (footerStart < 0) footerStart = tripHTML.indexOf('</body>');

  if (heroEnd > 0 && footerStart > heroEnd) {
    return tripHTML.slice(0,heroEnd) + '\n' + body + tripHTML.slice(footerStart);
  }
  return tripHTML.replace('</body>', body+'</body>');
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  var ed = document.getElementById('editor');
  ed.innerHTML = '';
  sections.forEach(function(sec,si) { ed.appendChild(makeSection(sec,si)); });
}

function makeSection(sec,si) {
  var block = document.createElement('div');
  block.className = 'sec-block';

  var hdr = document.createElement('div'); hdr.className = 'sec-hdr';
  if (sec.name !== null) {
    var ni = document.createElement('input'); ni.className='sec-name'; ni.value=sec.name; ni.placeholder='Section name…';
    ni.oninput = function(){ sec.name=ni.value; setSaveDirty(true); rebuildPanelSecs(); };
    hdr.appendChild(ni);
  }
  var ct = document.createElement('span'); ct.className='sec-count'; ct.textContent=sec.photos.length+' photo'+(sec.photos.length===1?'':'s');
  hdr.appendChild(ct);

  if (sec.name !== null) {
    var db = document.createElement('button'); db.className='btn-del-sec'; db.textContent='Remove section';
    db.onclick = function() {
      if (!confirm('Remove "'+sec.name+'" and all its photos?')) return;
      sections.splice(si,1); closePanel(); render(); setSaveDirty(true);
    };
    hdr.appendChild(db);
  }
  block.appendChild(hdr);

  var grid = document.createElement('div'); grid.className='photo-grid-admin';
  sec.photos.forEach(function(p,pi) { grid.appendChild(makeCard(p,si,pi)); });

  // Add tile
  var add = document.createElement('div'); add.className='add-tile';
  add.innerHTML='<span class="plus">+</span><span>Add Photos</span>';
  add.onclick = function() { window._upSi=si; document.getElementById('file-inp').click(); };
  grid.appendChild(add);
  block.appendChild(grid);
  return block;
}

function makeCard(photo,si,pi) {
  var c = document.createElement('div'); c.className='pcard'; c.draggable=true;
  c.dataset.si=si; c.dataset.pi=pi;

  var img = document.createElement('img'); img.src=photo.src;
  img.onerror=function(){img.classList.add('err');};
  c.appendChild(img);

  if (photo.isNew) { var nb=document.createElement('div'); nb.className='new-badge'; nb.textContent='New'; c.appendChild(nb); }

  var dh=document.createElement('span'); dh.className='drag-dot'; dh.textContent='⠿'; dh.title='Drag to reorder'; c.appendChild(dh);

  var db=document.createElement('button'); db.className='del-btn'; db.textContent='✕'; db.title='Remove';
  db.onclick=function(e){ e.stopPropagation(); if(!confirm('Remove this photo?')) return;
    sections[si].photos.splice(pi,1); if(sel&&sel.si===si&&sel.pi===pi) closePanel();
    render(); setSaveDirty(true); };
  c.appendChild(db);

  var cb=document.createElement('div'); cb.className='cap-bar'+(photo.caption?' has':'');
  cb.textContent=photo.caption||'tap to add caption…'; c.appendChild(cb);

  c.onclick=function(e){ if(e.target===db) return; openPanel(si,pi,c); };

  // Drag
  c.ondragstart=function(e){ drag={si:si,pi:pi}; e.dataTransfer.effectAllowed='move'; setTimeout(function(){c.classList.add('dragging');},0); };
  c.ondragend=function(){ c.classList.remove('dragging'); document.querySelectorAll('.dragover').forEach(function(x){x.classList.remove('dragover');}); drag=null; };
  c.ondragover=function(e){ e.preventDefault(); if(drag) c.classList.add('dragover'); };
  c.ondragleave=function(){ c.classList.remove('dragover'); };
  c.ondrop=function(e){ e.preventDefault(); c.classList.remove('dragover');
    if(!drag||( drag.si===si&&drag.pi===pi)) return;
    var moved=sections[drag.si].photos.splice(drag.pi,1)[0];
    var dst=pi; if(drag.si===si&&drag.pi<pi) dst--;
    sections[si].photos.splice(dst,0,moved);
    closePanel(); render(); setSaveDirty(true); };
  return c;
}

// ── PANEL ─────────────────────────────────────────────────────────
function openPanel(si,pi,cardEl) {
  document.querySelectorAll('.pcard.sel').forEach(function(c){c.classList.remove('sel');});
  if (sel&&sel.si===si&&sel.pi===pi) { closePanel(); return; }
  sel={si:si,pi:pi}; cardEl.classList.add('sel');
  var p=sections[si].photos[pi];
  document.getElementById('panel-img').src=p.src;
  document.getElementById('panel-file').textContent=p.src.split('/').pop();
  document.getElementById('panel-cap').value=p.caption||'';
  rebuildPanelSecs();
  document.getElementById('panel-sec').value=si;
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  sel=null;
  document.querySelectorAll('.pcard.sel').forEach(function(c){c.classList.remove('sel');});
  document.getElementById('panel').classList.remove('open');
}
function rebuildPanelSecs() {
  var s=document.getElementById('panel-sec'), v=s.value; s.innerHTML='';
  sections.forEach(function(sec,i){ var o=document.createElement('option'); o.value=i; o.textContent=sec.name||'(no heading)'; s.appendChild(o); });
  if(sel) s.value=sel.si;
}
function panelCapInput() {
  if(!sel) return;
  var v=document.getElementById('panel-cap').value;
  sections[sel.si].photos[sel.pi].caption=v;
  var card=document.querySelector('.pcard.sel');
  if(card){ var cb=card.querySelector('.cap-bar'); cb.textContent=v||'tap to add caption…'; cb.className='cap-bar'+(v?' has':''); }
  setSaveDirty(true);
}
function panelSecChange() {
  if(!sel) return;
  var newSi=parseInt(document.getElementById('panel-sec').value);
  if(newSi===sel.si) return;
  var moved=sections[sel.si].photos.splice(sel.pi,1)[0];
  sections[newSi].photos.push(moved);
  closePanel(); render(); setSaveDirty(true);
}

// ── SECTION ───────────────────────────────────────────────────────
function addSection() {
  var inp=document.getElementById('sec-inp'), name=inp.value.trim();
  if(!name){inp.focus();return;}
  sections.push({name:name,photos:[]}); inp.value='';
  render(); setSaveDirty(true);
  document.querySelectorAll('.sec-block').forEach(function(b,i){ if(i===sections.length-1) b.scrollIntoView({behavior:'smooth',block:'start'}); });
}

// ── UPLOAD ────────────────────────────────────────────────────────
function sanitize(name) {
  var dot=name.lastIndexOf('.');
  var ext=dot>=0?name.slice(dot).toLowerCase():'';
  var base=name.slice(0,dot>=0?dot:name.length);
  return base.replace(/[^a-zA-Z0-9_-]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')+ext;
}

async function handleFiles(fileList, targetSi) {
  var files=Array.from(fileList).filter(function(f){return f.type.indexOf('image/')===0;});
  if(!files.length) return;
  var si = (targetSi!==null&&targetSi!==undefined) ? targetSi :
           (window._upSi!==undefined) ? window._upSi :
           (sections.length>0 ? sections.length-1 : -1);
  window._upSi=undefined;
  if(si<0||!sections[si]){ sections.push({name:null,photos:[]}); si=0; }

  showNotice('Uploading '+files.length+' photo'+(files.length===1?'':'s')+'…');

  var uploaded=[];
  for(var i=0;i<files.length;i++) {
    var f=files[i], safe=sanitize(f.name);
    try {
      var b64=await toB64(f);
      // Check if file already exists (get SHA if so)
      var existSHA=null;
      try { var ex=await ghGet('images/'+tripFolder+'/'+safe); existSHA=ex.sha; } catch(e){}
      await ghPut('images/'+tripFolder+'/'+safe, b64, 'Upload '+safe, existSHA);
      uploaded.push({src:'/images/'+tripFolder+'/'+safe, caption:'', isNew:true});
    } catch(e) { showNotice('Upload failed: '+safe+' — '+e.message,'err'); return; }
  }

  // Add to section
  uploaded.forEach(function(p){ sections[si].photos.push(p); });
  render();
  showNotice(uploaded.length+' photo'+(uploaded.length===1?'':'s')+' uploaded. Hit Save & Publish to go live.','ok');
  setSaveDirty(true);
}

// ── SAVE ─────────────────────────────────────────────────────────
async function doSave() {
  var btn=document.getElementById('save-btn');
  btn.innerHTML='<span class="spin"></span>Saving…'; btn.style.pointerEvents='none';
  closePanel();

  try {
    // Always get fresh SHA
    var fresh=await ghGet('trips/'+trip+'.html');
    tripSHA=fresh.sha;
    tripHTML=atob64(fresh.content);

    var newHTML=buildHTML();
    var res=await ghPut('trips/'+trip+'.html', btoa64(newHTML), 'Update '+trip, tripSHA);
    tripSHA=res.content.sha;
    tripHTML=newHTML;

    // Re-parse to keep state clean
    sections=parseHTML(newHTML);
    render();
    setSaveDirty(false);
    dirty=false;

    // Trigger deploy
    await fetch(HOOK,{method:'POST'});

    document.getElementById('save-msg').style.display='inline';
    setTimeout(function(){document.getElementById('save-msg').style.display='none';},5000);
    showNotice('Saved & deploying — live in ~1 min.','ok');
  } catch(e) {
    showNotice('Save failed: '+e.message,'err');
  }
  btn.innerHTML='Save &amp; Publish'; btn.style.pointerEvents='';
}

// ── LIVE TOGGLE ───────────────────────────────────────────────────
function setLiveToggle(html) {
  var live=html.indexOf('badge-plan')<0;
  document.getElementById('live-tog').checked=live;
  document.getElementById('live-lbl').textContent=live?'Live ✓':'Planning';
}
async function toggleLive() {
  var live=document.getElementById('live-tog').checked;
  document.getElementById('live-lbl').textContent=live?'Live ✓':'Planning';
  setSaveDirty(true);
}

// ── DIRTY STATE ───────────────────────────────────────────────────
function setSaveDirty(d) {
  dirty=d;
  var btn=document.getElementById('save-btn');
  if(d){ btn.classList.add('active'); } else { btn.classList.remove('active'); }
}

// ── HELPERS ───────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function atob64(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }
function btoa64(str){ return btoa(unescape(encodeURIComponent(str))); }
function toB64(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result.split(',')[1]);}; r.onerror=rej; r.readAsDataURL(file); }); }

async function ghGet(path) {
  var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,
    {headers:{'Authorization':'token '+TOK,'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function ghPut(path,content,message,sha) {
  var body={message:message,content:content};
  if(sha) body.sha=sha;
  var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,
    {method:'PUT',headers:{'Authorization':'token '+TOK,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function showNotice(msg,cls){
  var n=document.getElementById('notice');
  n.textContent=msg; n.className=cls||''; n.style.display='block';
  if(cls==='ok') setTimeout(function(){n.style.display='none';},5000);
}
function hideNotice(){ document.getElementById('notice').style.display='none'; }
</script>
