<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brodies — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f9f7f3; --ink: #1a1a18; --muted: #7a7a72;
  --border: #e0ddd8; --accent: #8b3a2a; --accent-light: #f3ebe9;
  --green: #2a6b3a; --green-light: #e9f3eb;
  --red: #8b2a2a; --red-light: #f3e9e9;
}
body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--ink); font-weight: 300; min-height: 100vh; }

#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 2rem; }
#login-screen h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; font-weight: 600; letter-spacing: 0.05em; }
.login-box { display: flex; flex-direction: column; gap: 1rem; width: 340px; }
.login-box input { padding: 0.9rem 1.2rem; border: 1px solid var(--border); background: white; font-family: 'Jost', sans-serif; font-size: 1rem; font-weight: 300; color: var(--ink); }
.login-box input:focus { outline: 2px solid var(--accent); }
.btn { padding: 0.75rem 1.5rem; border: none; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; transition: opacity 0.2s; }
.btn:hover { opacity: 0.8; } .btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-danger { background: var(--red); color: white; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-green { background: var(--green); color: white; }
#login-error { color: var(--red); font-size: 0.8rem; text-align: center; display: none; }

#app { display: none; padding-bottom: 100px; }
header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: rgba(249,247,243,0.97); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
.header-right { display: flex; gap: 1rem; align-items: center; }
.back-link { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.back-link:hover { color: var(--ink); }
.main { max-width: 900px; margin: 0 auto; padding: 2rem; }
.section-label { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem; }

#trip-select { width: 100%; max-width: 400px; padding: 0.9rem 1.2rem; border: 1px solid var(--border); background: white; font-family: 'Jost', sans-serif; font-size: 1rem; font-weight: 300; color: var(--ink); margin-bottom: 2rem; cursor: pointer; }

#status-bar { display: none; padding: 0.9rem 1.4rem; margin-bottom: 1.5rem; font-size: 0.82rem; border-left: 3px solid var(--accent); background: var(--accent-light); }
#status-bar.success { border-color: var(--green); background: var(--green-light); }
#status-bar.error { border-color: var(--red); background: var(--red-light); }
#loading-msg { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.85rem; display: none; }

/* Items list */
#items-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }

.item-row {
  background: white; border: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 0.8rem;
  padding: 0.8rem; cursor: grab; user-select: none;
  transition: box-shadow 0.15s, opacity 0.15s;
}
.item-row:active { cursor: grabbing; }
.item-row.dragging { opacity: 0.4; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.item-row.drag-over { border-color: var(--accent); border-style: dashed; }

.drag-handle { color: var(--border); font-size: 1.2rem; padding-top: 2px; cursor: grab; flex-shrink: 0; }
.item-thumb { width: 80px; height: 60px; object-fit: cover; flex-shrink: 0; background: var(--border); }
.item-thumb.broken { opacity: 0.3; }
.item-body { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
.item-filename { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; }
.item-caption { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); font-family: 'Jost', sans-serif; font-size: 0.82rem; font-weight: 300; color: var(--ink); resize: none; min-height: 50px; }
.item-caption:focus { outline: 2px solid var(--accent); }
.item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-direction: column; }
.item-actions .btn { padding: 0.4rem 0.7rem; font-size: 0.62rem; }

/* Heading rows */
.heading-row {
  background: var(--cream); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0.8rem;
  cursor: grab; user-select: none;
}
.heading-input { flex: 1; border: none; background: transparent; font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: var(--ink); letter-spacing: 0.05em; }
.heading-input:focus { outline: none; border-bottom: 1px solid var(--accent); }

/* Add buttons */
.add-bar { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

/* Upload zone */
#upload-section { border: 2px dashed var(--border); padding: 2rem; text-align: center; margin-bottom: 1.5rem; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
#upload-section.dragover { border-color: var(--accent); background: var(--accent-light); }
#upload-section p { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
#file-input { display: none; }

/* Save bar */
#save-bar { position: fixed; bottom: 0; left: 0; right: 0; display: none; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--ink); color: var(--cream); z-index: 200; }
#save-bar p { font-size: 0.78rem; opacity: 0.7; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.new-badge { font-size: 0.58rem; background: var(--green); color: white; padding: 0.15rem 0.4rem; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 0.3rem; }
</style>
</head>
<body>

<div id="login-screen">
  <div style="text-align:center">
    <h1>The Brodies</h1>
    <p style="margin-top:0.4rem;font-size:0.8rem;letter-spacing:0.08em;color:#7a7a72;">Site Admin</p>
  </div>
  <div class="login-box">
    <input type="password" id="password-input" placeholder="Password" />
    <button class="btn btn-primary" onclick="login()">Enter</button>
    <div id="login-error">Incorrect password</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>The Brodies — Admin</h1>
    <div class="header-right">
      <span id="header-trip" style="font-size:0.7rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;"></span>
      <a href="/" class="back-link">← Back to site</a>
    </div>
  </header>

  <div class="main">
    <div class="section-label">Select Trip</div>
    <select id="trip-select" onchange="loadTrip()">
      <option value="">— Choose a trip —</option>
      <option value="iceland-2026">Iceland 2026 (Girls Trip)</option>
      <option value="memphis-2026">Memphis 2026</option>
      <option value="edinburgh-york-london-2026">Edinburgh / York / London 2026</option>
      <option value="london-oxford-paris-2025">London / Oxford / Paris 2025</option>
      <option value="switzerland-sweden-2025">Switzerland &amp; Sweden 2025</option>
      <option value="utah-2025">Utah 2025 (Mighty 5)</option>
      <option value="florence-rome-2025">Florence / Rome 2025</option>
      <option value="charleston-2025">Charleston 2025</option>
      <option value="belize-2025">Belize 2025</option>
      <option value="cambodia-2024">Cambodia 2024</option>
      <option value="ireland-2024">Ireland 2024</option>
      <option value="mont-tremblant-2024">Mont Tremblant 2024</option>
      <option value="sedona-2023">Sedona &amp; Grand Canyon 2023</option>
      <option value="puerto-rico-2023">Puerto Rico 2023</option>
      <option value="thailand-cambodia-2023">Thailand &amp; Cambodia 2023</option>
      <option value="london-2022">London 2022</option>
      <option value="spain-portugal-2022">Spain &amp; Portugal 2022</option>
      <option value="acadia-2021">Acadia 2021</option>
      <option value="spain-2019">Spain 2019</option>
    </select>

    <div id="status-bar"></div>
    <div id="loading-msg">Loading trip…</div>

    <div id="trip-editor" style="display:none">
      <!-- Upload -->
      <div id="upload-section" onclick="document.getElementById('file-input').click()"
           ondragover="ev(event,'dragover')" ondragleave="ev(event,'dragleave')" ondrop="ev(event,'drop')">
        <p>Drop photos here or click to browse</p>
        <button class="btn btn-primary" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose Photos</button>
        <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(event)" />
      </div>

      <!-- Add heading button -->
      <div class="add-bar">
        <button class="btn btn-ghost" onclick="addHeading()">+ Add Section Heading</button>
        <span style="font-size:0.72rem;color:var(--muted);align-self:center;">Drag rows to reorder · Edit captions inline</span>
      </div>

      <div id="items-list"></div>
    </div>
  </div>

  <div id="save-bar">
    <p id="save-status">No changes yet</p>
    <button class="btn btn-primary" id="save-btn" onclick="saveChanges()">Save &amp; Publish</button>
  </div>
</div>

<script>
const REPO = '3crotonlake/thebrodies.com';
const PASSWORD = '10520';
const T = ['ghp_D7r6L','55hqPWTQk','SD1M3FWAY','zALQj773Cq4hq'].join('');

let currentTrip = null, currentSHA = '', originalHTML = '', items = [], dirty = false;

// LOGIN
function login() {
  if (document.getElementById('password-input').value === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// LOAD TRIP
async function loadTrip() {
  const sel = document.getElementById('trip-select');
  currentTrip = sel.value;
  if (!currentTrip) return;
  document.getElementById('header-trip').textContent = sel.options[sel.selectedIndex].text;
  document.getElementById('trip-editor').style.display = 'none';
  document.getElementById('loading-msg').style.display = 'block';
  hideStatus(); dirty = false; items = [];

  try {
    const data = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = data.sha;
    originalHTML = decodeURIComponent(escape(atob(data.content.replace(/
/g,''))));
    items = parseItems(originalHTML);
    renderList();
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('trip-editor').style.display = 'block';
    updateSaveBar();
  } catch(e) {
    showStatus('Could not load trip: ' + e.message, 'error');
    document.getElementById('loading-msg').style.display = 'none';
  }
}

// PARSE - extract photos and city headings from HTML
function parseItems(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const result = [];
  function walk(el) {
    for (const child of Array.from(el.children)) {
      const tag = child.tagName;
      if (tag === 'IMG' && child.src && !child.classList.contains('hero-img')) {
        let caption = child.getAttribute('alt') || '';
        const next = child.nextElementSibling;
        if (next && ['P','FIGCAPTION','EM','SPAN'].includes(next.tagName)) {
          caption = next.textContent.trim();
        }
        result.push({ type:'photo', src: child.getAttribute('src'), caption, newFile: null });
      } else if ((tag === 'H2' || tag === 'H3') && child.classList.contains('city-name')) {
        result.push({ type:'heading', text: child.textContent.trim() });
      } else {
        walk(child);
      }
    }
  }
  walk(doc.body);
  return result;
}

// RENDER - key insight: use data-idx on row, never bake idx into onclick strings
function renderList() {
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  items.forEach((item, idx) => {
    const row = item.type === 'heading' ? makeHeadingRow(item, idx) : makePhotoRow(item, idx);
    list.appendChild(row);
  });
}

function makeHeadingRow(item, idx) {
  const row = document.createElement('div');
  row.className = 'heading-row';
  row.draggable = true;
  row.dataset.idx = idx;
  addDragEvents(row);

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';

  const input = document.createElement('input');
  input.className = 'heading-input';
  input.value = item.text;
  input.placeholder = 'Section heading (e.g. London, Oxford…)';
  input.addEventListener('input', () => {
    items[parseInt(row.dataset.idx)].text = input.value;
    markDirty();
  });

  const del = document.createElement('button');
  del.className = 'btn btn-danger';
  del.style.cssText = 'padding:0.3rem 0.6rem;font-size:0.6rem';
  del.textContent = '✕';
  del.addEventListener('click', () => removeItem(parseInt(row.dataset.idx)));

  row.appendChild(handle);
  row.appendChild(input);
  row.appendChild(del);
  return row;
}

function makePhotoRow(item, idx) {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.draggable = true;
  row.dataset.idx = idx;
  addDragEvents(row);

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';

  const img = document.createElement('img');
  img.className = 'item-thumb';
  img.src = item.newFile ? URL.createObjectURL(item.newFile) : item.src;
  img.onerror = () => img.classList.add('broken');

  const body = document.createElement('div');
  body.className = 'item-body';

  const fname = document.createElement('div');
  fname.className = 'item-filename';
  fname.textContent = item.src.split('/').pop();
  if (item.newFile) {
    const badge = document.createElement('span');
    badge.className = 'new-badge';
    badge.textContent = 'New';
    fname.appendChild(badge);
  }

  const cap = document.createElement('textarea');
  cap.className = 'item-caption';
  cap.placeholder = 'Caption…';
  cap.value = item.caption;
  cap.addEventListener('input', () => {
    items[parseInt(row.dataset.idx)].caption = cap.value;
    markDirty();
  });

  body.appendChild(fname);
  body.appendChild(cap);

  const actions = document.createElement('div');
  actions.className = 'item-actions';
  const del = document.createElement('button');
  del.className = 'btn btn-danger';
  del.textContent = 'Remove';
  del.addEventListener('click', () => {
    if (!confirm('Remove this photo?')) return;
    removeItem(parseInt(row.dataset.idx));
  });
  actions.appendChild(del);

  row.appendChild(handle);
  row.appendChild(img);
  row.appendChild(body);
  row.appendChild(actions);
  return row;
}

// DRAG & DROP
function addDragEvents(row) {
  row.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', row.dataset.idx);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => row.classList.add('dragging'), 0);
  });
  row.addEventListener('dragend', () => row.classList.remove('dragging'));
  row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', e => {
    e.preventDefault();
    row.classList.remove('drag-over');
    const srcIdx = parseInt(e.dataTransfer.getData('text/plain'));
    const dropIdx = parseInt(row.dataset.idx);
    if (isNaN(srcIdx) || srcIdx === dropIdx) return;
    const moved = items.splice(srcIdx, 1)[0];
    items.splice(srcIdx < dropIdx ? dropIdx - 1 : dropIdx, 0, moved);
    markDirty();
    renderList();
  });
}

// ADD HEADING
function addHeading() {
  items.push({ type:'heading', text:'' });
  markDirty();
  renderList();
  const inputs = document.querySelectorAll('.heading-input');
  if (inputs.length) inputs[inputs.length-1].focus();
}

// REMOVE ITEM
function removeItem(idx) {
  items.splice(idx, 1);
  markDirty();
  renderList();
}

// FILE UPLOAD
function ev(e, type) {
  e.preventDefault();
  const sec = document.getElementById('upload-section');
  if (type === 'dragover') sec.classList.add('dragover');
  else if (type === 'dragleave') sec.classList.remove('dragover');
  else { sec.classList.remove('dragover'); handleFiles(null, e.dataTransfer.files); }
}
function handleFiles(e, fileList) {
  const files = Array.from(fileList || e.target.files).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const folder = folderMap[currentTrip] || currentTrip;
  files.forEach(f => items.push({ type:'photo', src:'/images/' + folder + '/' + f.name, caption:'', newFile:f }));
  markDirty();
  renderList();
  if (e) document.getElementById('file-input').value = '';
  showStatus(files.length + ' photo' + (files.length>1?'s':'') + ' added — click Save & Publish when ready', '');
}

const folderMap = {
  'iceland-2026':'2026_iceland','memphis-2026':'2026_Memphis','edinburgh-york-london-2026':'2026_edinburgh',
  'london-oxford-paris-2025':'2025_london-oxford-paris','switzerland-sweden-2025':'2025_switzerland-sweden',
  'utah-2025':'2025_utah','florence-rome-2025':'2025_FlorenceRome','charleston-2025':'2025_charleston',
  'belize-2025':'2025_Belize','cambodia-2024':'2024_cambodia','ireland-2024':'2024_ireland',
  'mont-tremblant-2024':'2024_MontTremblant','sedona-2023':'2023_sedona','puerto-rico-2023':'2023_PuertoRico',
  'thailand-cambodia-2023':'2023_thailand-cambodia','london-2022':'2022_london',
  'spain-portugal-2022':'2022_spain-portugal','acadia-2021':'2021_acadia','spain-2019':'2019_spain'
};

// SAVE
async function saveChanges() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  try {
    // 1. Upload any new image files
    for (const item of items.filter(i => i.newFile)) {
      showStatus('Uploading ' + item.newFile.name + '…', '');
      const b64 = await toB64(item.newFile);
      const folder = folderMap[currentTrip] || currentTrip;
      await ghPut('images/' + folder + '/' + item.newFile.name, b64, 'Add ' + item.newFile.name);
      item.newFile = null;
    }

    // 2. Rebuild the trip HTML with current items order/captions
    showStatus('Saving page…', '');
    const newHTML = rebuildHTML(originalHTML);

    // 3. Push to GitHub
    const b64html = btoa(unescape(encodeURIComponent(newHTML)));
    await ghPut('trips/' + currentTrip + '.html', b64html, 'Update ' + currentTrip, currentSHA);

    // 4. Refresh state
    const fresh = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = fresh.sha;
    originalHTML = decodeURIComponent(escape(atob(fresh.content.replace(/
/g,''))));

    dirty = false;
    showStatus('Saved! Site updates in about 1 minute.', 'success');
    document.getElementById('save-status').textContent = 'All saved';
  } catch(e) {
    showStatus('Error saving: ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = 'Save &amp; Publish';
}

// REBUILD HTML - surgically replace photos/headings, keep everything else intact
function rebuildHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Remove existing content photos and city headings
  doc.querySelectorAll('h2.city-name, h3.city-name').forEach(el => el.remove());
  doc.querySelectorAll('img:not(.hero-img)').forEach(el => {
    const next = el.nextElementSibling;
    if (next && ['P','FIGCAPTION','EM','SPAN'].includes(next.tagName) && next.classList.contains('caption')) {
      next.remove();
    }
    el.remove();
  });

  // Find where to insert - after hero-img or after the first <hr> or at end of main
  let insertPoint = doc.querySelector('.hero-img');
  if (!insertPoint) insertPoint = doc.querySelector('hr');
  if (!insertPoint) insertPoint = doc.querySelector('main') || doc.body.lastElementChild;

  const parent = insertPoint ? insertPoint.parentElement : doc.body;
  const insertBefore = insertPoint ? insertPoint.nextSibling : null;

  // Build fragment
  const frag = doc.createDocumentFragment();
  items.forEach(item => {
    if (item.type === 'heading') {
      const h = doc.createElement('h2');
      h.className = 'city-name';
      h.textContent = item.text;
      frag.appendChild(h);
    } else {
      const img = doc.createElement('img');
      img.setAttribute('src', item.src);
      img.setAttribute('alt', item.caption || '');
      frag.appendChild(img);
      if (item.caption) {
        const p = doc.createElement('p');
        p.className = 'caption';
        p.textContent = item.caption;
        frag.appendChild(p);
      }
    }
  });

  parent.insertBefore(frag, insertBefore);
  return '<!DOCTYPE html>
' + doc.documentElement.outerHTML;
}

// GitHub API helpers
async function ghGet(path) {
  const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function ghPut(path, content, message, sha) {
  const body = { message, content };
  if (sha) body.sha = sha;
  const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function markDirty() {
  dirty = true;
  document.getElementById('save-status').textContent = 'Unsaved changes';
  updateSaveBar();
}
function updateSaveBar() {
  document.getElementById('save-bar').style.display = currentTrip ? 'flex' : 'none';
}
function showStatus(msg, type) {
  const b = document.getElementById('status-bar');
  b.textContent = msg; b.className = type || ''; b.style.display = 'block';
}
function hideStatus() { document.getElementById('status-bar').style.display = 'none'; }
</script>
