<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brodies — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f9f7f3;--ink:#1a1a18;--muted:#7a7a72;--border:#e0ddd8;--accent:#8b3a2a;--accent-light:#f3ebe9;--green:#2a6b3a;--green-light:#e9f3eb;--red:#8b2a2a;--red-light:#f3e9e9;--gold:#c9a84c}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);font-weight:300;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:2rem}
#login-screen h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;letter-spacing:.05em}
.login-box{display:flex;flex-direction:column;gap:1rem;width:320px}
.login-box input{padding:.9rem 1.2rem;border:1px solid var(--border);background:white;font-family:'Jost',sans-serif;font-size:1rem;color:var(--ink)}
.login-box input:focus{outline:2px solid var(--accent)}
#login-error{color:var(--red);font-size:.8rem;text-align:center;display:none}

/* BUTTONS */
.btn{padding:.65rem 1.4rem;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;transition:opacity .2s}
.btn:hover{opacity:.8}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-save{background:var(--accent);color:white;padding:.7rem 2rem;font-size:.75rem}
.btn-danger{background:var(--red);color:white}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:.4rem .8rem;font-size:.65rem}

/* APP */
#app{display:none}
header{position:sticky;top:0;z-index:100;background:rgba(249,247,243,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.8rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;margin-right:.5rem}
#trip-select{padding:.5rem .8rem;border:1px solid var(--border);background:white;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--ink);cursor:pointer;min-width:220px}
.sort-btn{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-decoration:underline;white-space:nowrap;background:none;border:none;font-family:'Jost',sans-serif}
.sort-btn:hover{color:var(--ink)}
.header-spacer{flex:1}
#view-btn{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}
#view-btn:hover{color:var(--ink)}
#save-btn-wrap{display:none;align-items:center;gap:.8rem}
#changes-count{font-size:.75rem;color:var(--accent)}
#save-status{font-size:.72rem;color:var(--green);display:none}

/* MAIN */
.main{max-width:840px;margin:0 auto;padding:1.5rem 2rem 4rem}
.section-label{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}

#page-msg{display:none;padding:.8rem 1.2rem;margin-bottom:1.2rem;font-size:.82rem;border-left:3px solid var(--accent);background:var(--accent-light)}
#page-msg.success{border-color:var(--green);background:var(--green-light)}
#page-msg.error{border-color:var(--red);background:var(--red-light)}
#loading-msg{padding:3rem;text-align:center;color:var(--muted);font-size:.85rem;display:none}

/* TRIP META BAR */
#trip-meta{display:none;margin-bottom:1.5rem;padding:.8rem 1.2rem;background:white;border:1px solid var(--border);display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:.6rem;font-size:.78rem}
.toggle-wrap{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:21px;cursor:pointer;transition:.25s}
.toggle-track:before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:white;border-radius:50%;transition:.25s}
input:checked + .toggle-track{background:var(--green)}
input:checked + .toggle-track:before{transform:translateX(17px)}

/* ADD SECTION */
.add-section-row{display:flex;gap:.8rem;align-items:center;margin-bottom:1.5rem}
.new-section-input{padding:.6rem .9rem;border:1px solid var(--border);background:white;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink);flex:1;max-width:300px}
.new-section-input:focus{outline:2px solid var(--accent)}

/* UPLOAD */
#upload-zone{border:2px dashed var(--border);padding:1.2rem;text-align:center;margin-bottom:1.5rem;cursor:pointer;transition:all .2s}
#upload-zone:hover,#upload-zone.over{border-color:var(--accent);background:var(--accent-light)}
#upload-zone p{font-size:.8rem;color:var(--muted);margin-bottom:.6rem}
#file-input{display:none}

/* SECTION BLOCKS */
.section-block{margin-bottom:1.5rem}
.section-heading-row{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border);margin-bottom:.5rem}
.section-name-input{flex:1;border:none;background:transparent;font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--ink);letter-spacing:.04em}
.section-name-input:focus{outline:none;border-bottom:2px solid var(--accent)}
.section-name-input.unsaved{color:var(--accent)}

/* PHOTO ROWS */
.photo-row{display:flex;align-items:flex-start;gap:.8rem;padding:.7rem;background:white;border:1px solid var(--border);margin-bottom:4px;transition:background .15s}
.photo-row:hover{background:#faf9f7}
.photo-row.dragging{opacity:.4;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.photo-row.drag-over{border-color:var(--accent);border-style:dashed}
.drag-handle{color:#ccc;font-size:1.1rem;cursor:grab;flex-shrink:0;padding-top:4px;user-select:none}
.photo-thumb{width:72px;height:56px;object-fit:cover;flex-shrink:0;background:var(--border)}
.photo-thumb.broken{opacity:.3;filter:grayscale(1)}
.photo-info{flex:1;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.photo-filename{font-size:.6rem;color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-caption-input{width:100%;padding:.4rem .6rem;border:1px solid var(--border);font-family:'Jost',sans-serif;font-size:.8rem;color:var(--ink);resize:none;min-height:42px;background:var(--cream)}
.photo-caption-input:focus{outline:2px solid var(--accent);background:white}
.photo-caption-input.unsaved{border-color:var(--accent)}
.photo-controls{display:flex;flex-direction:column;gap:.4rem;flex-shrink:0;align-items:flex-end}
.section-select{padding:.4rem .5rem;border:1px solid var(--border);background:white;font-family:'Jost',sans-serif;font-size:.72rem;color:var(--ink);cursor:pointer;max-width:140px}
.section-select:focus{outline:2px solid var(--accent)}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:.9rem;padding:.2rem;transition:color .15s}
.del-btn:hover{color:var(--red)}
.new-badge{font-size:.55rem;background:var(--green);color:white;padding:.1rem .35rem;letter-spacing:.08em;text-transform:uppercase;margin-left:.3rem}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.15);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login-screen">
  <div style="text-align:center">
    <h1>The Brodies</h1>
    <p style="margin-top:.4rem;font-size:.8rem;letter-spacing:.08em;color:#7a7a72">Site Admin</p>
  </div>
  <div class="login-box">
    <input type="password" id="password-input" placeholder="Password">
    <button class="btn btn-primary" onclick="login()" style="padding:.9rem">Enter</button>
    <div id="login-error">Incorrect password</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Brodies Admin</h1>
    <select id="trip-select" onchange="loadTrip()">
      <option value="">— Select a trip —</option>
    </select>
    <button class="sort-btn" id="sort-btn" onclick="toggleSort()">Sort: Newest first</button>
    <div class="header-spacer"></div>
    <a id="view-btn" href="#" target="_blank" style="display:none" class="btn btn-ghost btn-sm">View page ↗</a>
    <div id="save-btn-wrap">
      <span id="changes-count"></span>
      <button class="btn btn-save" id="save-btn" onclick="saveChanges()">Save &amp; Publish</button>
    </div>
    <span id="save-status">Saved ✓ — live in ~1 min</span>
  </header>

  <div class="main">
    <div id="page-msg"></div>
    <div id="loading-msg">Loading trip…</div>

    <div id="trip-editor" style="display:none">

      <!-- Planning toggle -->
      <div id="trip-meta">
        <div class="meta-item">
          <span style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Status:</span>
          <label class="toggle-wrap">
            <input type="checkbox" id="live-toggle" onchange="toggleLive()">
            <span class="toggle-track"></span>
          </label>
          <span id="live-label" style="font-size:.78rem;color:var(--muted)">Planning</span>
        </div>
      </div>

      <!-- Upload zone -->
      <div id="upload-zone" onclick="document.getElementById('file-input').click()" ondragover="onDragUpload(event,'over')" ondragleave="onDragUpload(event,'leave')" ondrop="onDragUpload(event,'drop')">
        <p>Drop new photos here or click to browse</p>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose Photos</button>
        <input type="file" id="file-input" multiple accept="image/*" onchange="onFileSelect(event.target.files)">
      </div>

      <!-- Add section -->
      <div class="add-section-row">
        <input class="new-section-input" id="new-section-input" placeholder="New section name (e.g. Paris)…">
        <button class="btn btn-ghost btn-sm" onclick="addSection()">+ Add Section</button>
      </div>

      <!-- Sections -->
      <div id="editor-body"></div>

    </div>
  </div>
</div>

<script>
var REPO = '3crotonlake/thebrodies.com';
var PW = '10520';
var T = ['ghp_D7r6L','55hqPWTQk','SD1M3FWAY','zALQj773Cq4hq'].join('');

// State
var currentTrip = null;
var currentSHA = '';
var sections = [];   // [{name: string|null, photos: [{src, caption, isNew}]}]
var changes = 0;
var sortNewest = true;
var previewWin = null;

var TRIPS = [
  {v:'iceland-2026',      l:'Iceland 2026 (Girls Trip)',         y:2026},
  {v:'memphis-2026',      l:'Memphis 2026',                      y:2026},
  {v:'edinburgh-york-london-2026', l:'Edinburgh / York / London 2026', y:2026},
  {v:'oxford-2026',       l:'Oxford 2026',                       y:2026},
  {v:'london-oxford-paris-2025', l:'London / Oxford / Paris 2025', y:2025},
  {v:'switzerland-sweden-2025', l:'Switzerland & Sweden 2025',   y:2025},
  {v:'utah-2025',         l:'Utah 2025 (Mighty 5)',              y:2025},
  {v:'florence-rome-2025',l:'Florence / Rome 2025',              y:2025},
  {v:'charleston-2025',   l:'Charleston 2025',                   y:2025},
  {v:'belize-2025',       l:'Belize 2025',                       y:2025},
  {v:'cambodia-2024',     l:'Cambodia 2024',                     y:2024},
  {v:'ireland-2024',      l:'Ireland 2024',                      y:2024},
  {v:'mont-tremblant-2024',l:'Mont Tremblant 2024',              y:2024},
  {v:'sedona-2023',       l:'Sedona & Grand Canyon 2023',        y:2023},
  {v:'puerto-rico-2023',  l:'Puerto Rico 2023',                  y:2023},
  {v:'thailand-cambodia-2023', l:'Thailand & Cambodia 2023',     y:2023},
  {v:'london-2022',       l:'London 2022',                       y:2022},
  {v:'spain-portugal-2022',l:'Spain & Portugal 2022',            y:2022},
  {v:'acadia-2021',       l:'Acadia 2021',                       y:2021},
  {v:'spain-2019',        l:'Spain 2019',                        y:2019}
];

var FOLDERS = {
  'iceland-2026':'2026_iceland','memphis-2026':'2026_Memphis',
  'edinburgh-york-london-2026':'2026_edinburgh','oxford-2026':'2026_oxford',
  'london-oxford-paris-2025':'2025_london-oxford-paris',
  'switzerland-sweden-2025':'2025_switzerland-sweden','utah-2025':'2025_utah',
  'florence-rome-2025':'2025_FlorenceRome','charleston-2025':'2025_charleston',
  'belize-2025':'2025_Belize','cambodia-2024':'2024_cambodia','ireland-2024':'2024_ireland',
  'mont-tremblant-2024':'2024_MontTremblant','sedona-2023':'2023_sedona',
  'puerto-rico-2023':'2023_PuertoRico','thailand-cambodia-2023':'2023_thailand-cambodia',
  'london-2022':'2022_london','spain-portugal-2022':'2022_spain-portugal',
  'acadia-2021':'2021_acadia','spain-2019':'2019_spain'
};

// ── SESSION ──────────────────────────────────────────────
window.addEventListener('load', function() {
  buildDropdown();
  if (sessionStorage.getItem('brodies_auth') === 'ok') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
});

function login() {
  if (document.getElementById('password-input').value === PW) {
    sessionStorage.setItem('brodies_auth', 'ok');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('password-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

// ── DROPDOWN ──────────────────────────────────────────────
function buildDropdown() {
  var sel = document.getElementById('trip-select');
  var cur = sel.value;
  var sorted = TRIPS.slice().sort(function(a, b) {
    return sortNewest ? (b.y - a.y || a.l.localeCompare(b.l)) : a.l.localeCompare(b.l);
  });
  sel.innerHTML = '<option value="">— Select a trip —</option>';
  sorted.forEach(function(t) {
    var o = document.createElement('option');
    o.value = t.v; o.textContent = t.l;
    if (t.v === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function toggleSort() {
  sortNewest = !sortNewest;
  document.getElementById('sort-btn').textContent = sortNewest ? 'Sort: Newest first' : 'Sort: A–Z';
  buildDropdown();
}

// ── LOAD TRIP ──────────────────────────────────────────────
async function loadTrip() {
  var sel = document.getElementById('trip-select');
  currentTrip = sel.value;
  if (!currentTrip) return;

  document.getElementById('view-btn').href = '/trips/' + currentTrip + '.html';
  document.getElementById('view-btn').style.display = 'block';
  document.getElementById('trip-editor').style.display = 'none';
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('trip-meta').style.display = 'none';
  hideMsg();
  resetChanges();

  try {
    var data = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = data.sha;
    var html = decodeB64(data.content);
    sections = parseHTML(html);
    renderEditor();
    renderLiveToggle(html);
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('trip-editor').style.display = 'block';
    document.getElementById('trip-meta').style.display = 'flex';
  } catch(e) {
    showMsg('Could not load: ' + e.message, 'error');
    document.getElementById('loading-msg').style.display = 'none';
  }
}

// ── PARSE HTML ──────────────────────────────────────────────
function parseHTML(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var result = [];
  var current = null;

  function walk(el) {
    Array.from(el.children).forEach(function(child) {
      var tag = child.tagName;
      if ((tag === 'H2' || tag === 'H3') && child.classList.contains('city-name')) {
        current = { name: child.textContent.trim(), photos: [] };
        result.push(current);
        return;
      }
      if (tag === 'DIV' && child.classList.contains('photo-grid')) {
        if (!current) { current = { name: null, photos: [] }; result.push(current); }
        child.querySelectorAll('.photo-item').forEach(function(item) {
          var img = item.querySelector('img');
          if (!img || !img.getAttribute('src')) return;
          var capEl = item.querySelector('p.photo-caption, p.caption, div.caption, figcaption');
          current.photos.push({
            src: img.getAttribute('src'),
            caption: capEl ? capEl.textContent.trim() : (img.getAttribute('alt') || ''),
            isNew: false
          });
        });
        return;
      }
      if (['NAV','HEADER','FOOTER','SCRIPT','STYLE'].indexOf(tag) < 0) walk(child);
    });
  }
  walk(doc.body);
  return result;
}

// ── RENDER EDITOR ──────────────────────────────────────────
function renderEditor() {
  var body = document.getElementById('editor-body');
  body.innerHTML = '';
  sections.forEach(function(sec, si) {
    body.appendChild(makeSectionBlock(sec, si));
  });
}

function getSectionNames() {
  return sections.map(function(s) { return s.name || '(no heading)'; });
}

function makeSectionBlock(sec, si) {
  var block = document.createElement('div');
  block.className = 'section-block';
  block.dataset.si = si;

  // Heading row
  var headRow = document.createElement('div');
  headRow.className = 'section-heading-row';

  if (sec.name !== null) {
    var nameInput = document.createElement('input');
    nameInput.className = 'section-name-input';
    nameInput.value = sec.name;
    nameInput.placeholder = 'Section name…';
    nameInput.addEventListener('input', function() {
      sec.name = nameInput.value;
      nameInput.classList.add('unsaved');
      markChanged();
      // Rebuild all section dropdowns
      updateSectionDropdowns();
    });
    headRow.appendChild(nameInput);

    var delSecBtn = document.createElement('button');
    delSecBtn.className = 'btn btn-danger btn-sm';
    delSecBtn.textContent = 'Remove section';
    delSecBtn.onclick = function() {
      if (!confirm('Remove "' + sec.name + '" and all its photos?')) return;
      sections.splice(si, 1);
      renderEditor();
      markChanged();
    };
    headRow.appendChild(delSecBtn);
  } else {
    var lbl = document.createElement('span');
    lbl.style.cssText = 'font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase';
    lbl.textContent = 'Photos';
    headRow.appendChild(lbl);
  }
  block.appendChild(headRow);

  // Photo rows
  var photoList = document.createElement('div');
  photoList.dataset.si = si;
  sec.photos.forEach(function(photo, pi) {
    photoList.appendChild(makePhotoRow(photo, si, pi, photoList));
  });
  block.appendChild(photoList);

  return block;
}

function makePhotoRow(photo, si, pi, listEl) {
  var row = document.createElement('div');
  row.className = 'photo-row';
  row.draggable = true;

  // Drag handle
  var handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  row.appendChild(handle);

  // Thumb
  var thumb = document.createElement('img');
  thumb.className = 'photo-thumb';
  thumb.src = photo.src;
  thumb.onerror = function() { thumb.classList.add('broken'); };
  row.appendChild(thumb);

  // Info: filename + caption
  var info = document.createElement('div');
  info.className = 'photo-info';

  var fname = document.createElement('div');
  fname.className = 'photo-filename';
  fname.textContent = photo.src.split('/').pop();
  if (photo.isNew) {
    var badge = document.createElement('span');
    badge.className = 'new-badge';
    badge.textContent = 'New';
    fname.appendChild(badge);
  }

  var cap = document.createElement('textarea');
  cap.className = 'photo-caption-input';
  cap.placeholder = 'Add caption…';
  cap.value = photo.caption;
  cap.rows = 2;
  cap.addEventListener('input', function() {
    photo.caption = cap.value;
    cap.classList.add('unsaved');
    markChanged();
  });

  info.appendChild(fname);
  info.appendChild(cap);
  row.appendChild(info);

  // Controls: section dropdown + delete
  var controls = document.createElement('div');
  controls.className = 'photo-controls';

  // Section dropdown
  var secSel = document.createElement('select');
  secSel.className = 'section-select';
  secSel.dataset.role = 'section-select';
  rebuildSecDropdown(secSel, si);
  secSel.addEventListener('change', function() {
    var newSi = parseInt(secSel.value);
    if (newSi === si) return;
    // Move photo to new section
    sections[si].photos.splice(pi, 1);
    sections[newSi].photos.push(photo);
    renderEditor();
    markChanged();
  });

  var delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.title = 'Remove photo';
  delBtn.textContent = '✕';
  delBtn.onclick = function() {
    if (!confirm('Remove this photo from the page?')) return;
    sections[si].photos.splice(pi, 1);
    renderEditor();
    markChanged();
  };

  controls.appendChild(secSel);
  controls.appendChild(delBtn);
  row.appendChild(controls);

  // Drag within same section
  row.addEventListener('dragstart', function(e) {
    e.dataTransfer.setData('text/plain', String(pi));
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(function() { row.classList.add('dragging'); }, 0);
  });
  row.addEventListener('dragend', function() { row.classList.remove('dragging'); });
  row.addEventListener('dragover', function(e) { e.preventDefault(); row.classList.add('drag-over'); });
  row.addEventListener('dragleave', function() { row.classList.remove('drag-over'); });
  row.addEventListener('drop', function(e) {
    e.preventDefault();
    row.classList.remove('drag-over');
    var srcPi = parseInt(e.dataTransfer.getData('text/plain'));
    var dstPi = pi;
    if (isNaN(srcPi) || srcPi === dstPi) return;
    var moved = sections[si].photos.splice(srcPi, 1)[0];
    sections[si].photos.splice(srcPi < dstPi ? dstPi - 1 : dstPi, 0, moved);
    renderEditor();
    markChanged();
  });

  return row;
}

function rebuildSecDropdown(sel, currentSi) {
  sel.innerHTML = '';
  sections.forEach(function(s, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = s.name || '(no heading)';
    if (i === currentSi) opt.selected = true;
    sel.appendChild(opt);
  });
}

function updateSectionDropdowns() {
  document.querySelectorAll('[data-role="section-select"]').forEach(function(sel) {
    var curVal = sel.value;
    sel.innerHTML = '';
    sections.forEach(function(s, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = s.name || '(no heading)';
      if (String(i) === curVal) opt.selected = true;
      sel.appendChild(opt);
    });
  });
}

// ── ADD SECTION ──────────────────────────────────────────────
function addSection() {
  var input = document.getElementById('new-section-input');
  var name = input.value.trim();
  if (!name) { input.focus(); return; }
  sections.push({ name: name, photos: [] });
  input.value = '';
  renderEditor();
  markChanged();
}

// ── LIVE TOGGLE ──────────────────────────────────────────────
function renderLiveToggle(html) {
  var isPlanning = html.indexOf('badge-plan') >= 0;
  var cb = document.getElementById('live-toggle');
  cb.checked = !isPlanning;
  document.getElementById('live-label').textContent = isPlanning ? 'Planning (hidden)' : 'Live ✓';
}

async function toggleLive() {
  var isLive = document.getElementById('live-toggle').checked;
  document.getElementById('live-label').textContent = isLive ? 'Live ✓' : 'Planning (hidden)';
  try {
    var data = await ghGet('index.html');
    var html = decodeB64(data.content);
    if (isLive) {
      html = html.replace(/<span class="badge-plan">Planning<\/span>/g, '');
    } else {
      // Find this trip's card and add badge if missing
      var re = new RegExp('(href="trips/' + currentTrip + '\\.html"[\\s\\S]*?class="thumb-name">)((?!.*badge-plan)[^<]*)(</div>)');
      html = html.replace(re, '$1$2<span class="badge-plan">Planning</span>$3');
    }
    await ghPut('index.html', encodeB64(html), (isLive ? 'Mark live: ' : 'Mark planning: ') + currentTrip, data.sha);
    showMsg(isLive ? 'Trip is now live on the homepage.' : 'Trip marked as Planning.', 'success');
  } catch(e) {
    showMsg('Error: ' + e.message, 'error');
  }
}

// ── FILE UPLOAD ──────────────────────────────────────────────
function onDragUpload(e, type) {
  e.preventDefault();
  var z = document.getElementById('upload-zone');
  if (type === 'over') z.classList.add('over');
  else if (type === 'leave') z.classList.remove('over');
  else { z.classList.remove('over'); onFileSelect(e.dataTransfer.files); }
}

async function onFileSelect(fileList) {
  var files = Array.from(fileList).filter(function(f) { return f.type.indexOf('image/') === 0; });
  if (!files.length) return;
  document.getElementById('file-input').value = '';

  var folder = FOLDERS[currentTrip] || currentTrip;
  var lastSec = sections.length > 0 ? sections[sections.length - 1] : null;
  if (!lastSec) { sections.push({ name: null, photos: [] }); lastSec = sections[0]; }

  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    showMsg('Uploading ' + f.name + '…', '');
    try {
      var b64img = await toB64(f);
      await ghPut('images/' + folder + '/' + f.name, b64img, 'Add ' + f.name, null);
      lastSec.photos.push({ src: '/images/' + folder + '/' + f.name, caption: '', isNew: true });
      showMsg('Uploaded: ' + f.name + ' — scroll down to see it', 'success');
    } catch(e) {
      showMsg('Upload failed: ' + e.message, 'error');
    }
  }
  renderEditor();
  markChanged();
}

// ── SAVE ──────────────────────────────────────────────────────
async function saveChanges() {
  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  try {
    var data = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = data.sha;
    var baseHTML = decodeB64(data.content);
    var newHTML = buildHTML(baseHTML);
    var res = await ghPut('trips/' + currentTrip + '.html', encodeB64(newHTML), 'Update ' + currentTrip, currentSHA);
    currentSHA = res.content.sha;

    // Clear unsaved markers
    document.querySelectorAll('.unsaved').forEach(function(el) { el.classList.remove('unsaved'); });
    resetChanges();

    // Reload sections from saved HTML to keep in sync
    sections = parseHTML(newHTML);
    renderEditor();

    document.getElementById('save-status').style.display = 'block';
    setTimeout(function() { document.getElementById('save-status').style.display = 'none'; }, 5000);

    // Refresh preview if open
    if (previewWin && !previewWin.closed) previewWin.location.reload();

  } catch(e) {
    showMsg('Save error: ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = 'Save &amp; Publish';
}

// ── BUILD HTML ──────────────────────────────────────────────
function buildHTML(baseHTML) {
  var doc = new DOMParser().parseFromString(baseHTML, 'text/html');

  // Remove existing content
  Array.from(doc.querySelectorAll('h2.city-name, h3.city-name')).forEach(function(el) { el.remove(); });
  Array.from(doc.querySelectorAll('.photo-grid')).forEach(function(el) { el.remove(); });
  Array.from(doc.querySelectorAll('img:not(.hero-img)')).forEach(function(el) {
    var next = el.nextElementSibling;
    if (next && (next.classList.contains('caption') || next.classList.contains('photo-caption'))) next.remove();
    el.remove();
  });

  // Find insert point
  var hero = doc.querySelector('.hero');
  var parent = hero ? hero.parentElement : doc.body;
  var insertBefore = hero ? hero.nextSibling : null;

  // Build from sections
  var frag = doc.createDocumentFragment();
  sections.forEach(function(sec) {
    if (sec.name) {
      var h = doc.createElement('h2');
      h.className = 'city-name';
      h.textContent = sec.name;
      frag.appendChild(h);
    }
    if (sec.photos.length > 0) {
      var grid = doc.createElement('div');
      grid.className = 'photo-grid';
      sec.photos.forEach(function(photo) {
        var item = doc.createElement('div');
        item.className = 'photo-item';
        var img = doc.createElement('img');
        img.setAttribute('src', photo.src);
        img.setAttribute('alt', photo.caption || '');
        img.setAttribute('loading', 'lazy');
        item.appendChild(img);
        if (photo.caption) {
          var p = doc.createElement('p');
          p.className = 'photo-caption';
          p.textContent = photo.caption;
          item.appendChild(p);
        }
        grid.appendChild(item);
      });
      frag.appendChild(grid);
    }
  });

  parent.insertBefore(frag, insertBefore);
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

// ── VIEW BUTTON ──────────────────────────────────────────────
document.getElementById('view-btn').addEventListener('click', function(e) {
  e.preventDefault();
  var url = '/trips/' + currentTrip + '.html';
  if (previewWin && !previewWin.closed) {
    previewWin.location.href = url;
    previewWin.focus();
  } else {
    previewWin = window.open(url, 'brodies_preview');
  }
});

// ── CHANGE TRACKING ──────────────────────────────────────────
function markChanged() {
  changes++;
  document.getElementById('changes-count').textContent = changes + ' unsaved change' + (changes === 1 ? '' : 's');
  document.getElementById('save-btn-wrap').style.display = 'flex';
  document.getElementById('save-status').style.display = 'none';
}
function resetChanges() {
  changes = 0;
  document.getElementById('save-btn-wrap').style.display = 'none';
}

// ── HELPERS ──────────────────────────────────────────────────
async function ghGet(path) {
  var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function ghPut(path, content, message, sha) {
  var body = { message: message, content: content };
  if (sha) body.sha = sha;
  var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function decodeB64(b64) { return decodeURIComponent(escape(atob(b64.split('\n').join('')))); }
function encodeB64(str) { return btoa(unescape(encodeURIComponent(str))); }
function toB64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader(); r.onload = function() { res(r.result.split(',')[1]); }; r.onerror = rej; r.readAsDataURL(file);
  });
}
function showMsg(msg, cls) {
  var el = document.getElementById('page-msg');
  el.textContent = msg; el.className = cls || ''; el.style.display = 'block';
  if (cls === 'success') setTimeout(function() { el.style.display = 'none'; }, 4000);
}
function hideMsg() { document.getElementById('page-msg').style.display = 'none'; }
</script>
