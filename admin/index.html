<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brodies — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f9f7f3;--ink:#1a1a18;--muted:#7a7a72;--border:#e0ddd8;--accent:#8b3a2a;--accent-light:#f3ebe9;--green:#2a6b3a;--green-light:#e9f3eb;--red:#8b2a2a;--red-light:#f3e9e9;--gold:#c9a84c}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);font-weight:300;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:2rem}
#login-screen h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;letter-spacing:.05em}
.login-box{display:flex;flex-direction:column;gap:1rem;width:320px}
.login-box input{padding:.9rem 1.2rem;border:1px solid var(--border);background:white;font-family:'Jost',sans-serif;font-size:1rem;color:var(--ink)}
.login-box input:focus{outline:2px solid var(--accent)}
#login-error{color:var(--red);font-size:.8rem;text-align:center;display:none}

/* BUTTONS */
.btn{padding:.65rem 1.4rem;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;transition:opacity .2s;white-space:nowrap}
.btn:hover{opacity:.8}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-danger{background:var(--red);color:white;padding:.4rem .7rem;font-size:.62rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-green{background:var(--green);color:white}
.btn-gold{background:var(--gold);color:white}
.btn-sm{padding:.35rem .7rem;font-size:.62rem}

/* APP SHELL */
#app{display:none;padding-bottom:2rem}
header{position:sticky;top:0;z-index:100;background:rgba(249,247,243,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.8rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
header h1{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.header-center{display:flex;align-items:center;gap:.8rem;flex:1;max-width:600px}
#trip-select{flex:1;padding:.5rem .8rem;border:1px solid var(--border);background:white;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--ink);cursor:pointer}
.header-right{display:flex;align-items:center;gap:.8rem}
#status-indicator{font-size:.7rem;letter-spacing:.06em;color:var(--muted);min-width:80px}
#status-indicator.saving{color:var(--accent)}
#status-indicator.saved{color:var(--green)}
#status-indicator.error{color:var(--red)}
.sort-toggle{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-decoration:underline;white-space:nowrap}
.sort-toggle:hover{color:var(--ink)}

/* MAIN CONTENT */
.main{max-width:860px;margin:0 auto;padding:1.5rem 2rem}

/* STATUS BAR */
#page-status{display:none;padding:.8rem 1.2rem;margin-bottom:1.5rem;font-size:.82rem;border-left:3px solid var(--accent);background:var(--accent-light)}
#page-status.success{border-color:var(--green);background:var(--green-light)}
#page-status.error{border-color:var(--red);background:var(--red-light)}

/* TRIP META */
#trip-meta{display:none;margin-bottom:1.5rem;padding:1rem 1.2rem;background:white;border:1px solid var(--border);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.meta-label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#planning-toggle{display:flex;align-items:center;gap:.6rem}
.toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.3s}
input:checked + .toggle-slider{background:var(--green)}
input:checked + .toggle-slider:before{transform:translateX(18px)}
.toggle-label{font-size:.78rem;color:var(--muted)}

/* UPLOAD ZONE */
#upload-section{border:2px dashed var(--border);padding:1.5rem;text-align:center;margin-bottom:1.5rem;cursor:pointer;transition:all .2s;border-radius:2px}
#upload-section:hover,#upload-section.dragover{border-color:var(--accent);background:var(--accent-light)}
#upload-section p{font-size:.8rem;color:var(--muted);margin-bottom:.8rem}
#file-input{display:none}

/* SECTION GROUPS */
.section-group{margin-bottom:2rem;border:1px solid var(--border);background:white}
.section-header{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;background:var(--cream);border-bottom:1px solid var(--border)}
.section-title-input{flex:1;border:none;background:transparent;font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--ink);letter-spacing:.04em;padding:.2rem 0}
.section-title-input:focus{outline:none;border-bottom:1px solid var(--accent)}
.section-title-input::placeholder{color:var(--border)}
.section-actions{display:flex;gap:.5rem;flex-shrink:0}

/* PHOTO GRID IN ADMIN */
.admin-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border)}
.admin-photo-item{background:white;padding:.8rem;display:flex;flex-direction:column;gap:.5rem;cursor:grab;position:relative}
.admin-photo-item.dragging{opacity:.4}
.admin-photo-item.drag-over{outline:2px dashed var(--accent)}
.admin-thumb{width:100%;height:140px;object-fit:cover;display:block;background:var(--cream)}
.admin-thumb.broken{opacity:.3;filter:grayscale(1)}
.admin-filename{font-size:.6rem;color:var(--muted);letter-spacing:.03em;word-break:break-all}
.admin-caption{width:100%;padding:.4rem .6rem;border:1px solid var(--border);font-family:'Jost',sans-serif;font-size:.78rem;color:var(--ink);resize:none;min-height:44px;background:var(--cream)}
.admin-caption:focus{outline:2px solid var(--accent);background:white}
.admin-delete{position:absolute;top:.4rem;right:.4rem;background:var(--red);color:white;border:none;width:20px;height:20px;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.admin-photo-item:hover .admin-delete{opacity:1}

/* SECTION ADD PHOTO */
.section-add-photo{padding:.8rem 1rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.6rem}
.section-add-photo input[type=file]{display:none}
.section-add-label{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:.4rem .8rem;border:1px dashed var(--border);transition:all .2s}
.section-add-label:hover{border-color:var(--accent);color:var(--accent)}

/* ADD SECTION */
#add-section-bar{margin-bottom:1.5rem}

/* LOADING */
#loading-msg{text-align:center;padding:3rem;color:var(--muted);font-size:.85rem;display:none}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.new-badge{font-size:.55rem;background:var(--green);color:white;padding:.1rem .35rem;letter-spacing:.08em;text-transform:uppercase;margin-left:.3rem;vertical-align:middle}
</style>
</head>
<body>

<div id="login-screen">
  <div style="text-align:center">
    <h1>The Brodies</h1>
    <p style="margin-top:.4rem;font-size:.8rem;letter-spacing:.08em;color:#7a7a72">Site Admin</p>
  </div>
  <div class="login-box">
    <input type="password" id="password-input" placeholder="Password">
    <button class="btn btn-primary" onclick="login()" style="padding:.9rem">Enter</button>
    <div id="login-error">Incorrect password</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Brodies Admin</h1>
    <div class="header-center">
      <select id="trip-select" onchange="loadTrip()">
        <option value="">— Select a trip —</option>
      </select>
      <span class="sort-toggle" onclick="toggleSort()" id="sort-label">Sort: Newest</span>
    </div>
    <div class="header-right">
      <span id="status-indicator"></span>
      <a id="view-trip-btn" href="#" target="_blank" class="btn btn-ghost btn-sm" style="display:none">View page ↗</a>
    </div>
  </header>

  <div class="main">
    <div id="page-status"></div>
    <div id="loading-msg">Loading trip…</div>

    <div id="trip-editor" style="display:none">

      <!-- Trip meta: planning toggle -->
      <div id="trip-meta">
        <div id="planning-toggle">
          <span class="meta-label">Status:</span>
          <label class="toggle-switch">
            <input type="checkbox" id="planning-checkbox" onchange="togglePlanning()">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label" id="planning-label">Planning</span>
        </div>
      </div>

      <!-- Upload zone (global - adds to last section or creates new) -->
      <div id="upload-section" onclick="document.getElementById('file-input').click()" ondragover="uploadDrag(event,'over')" ondragleave="uploadDrag(event,'leave')" ondrop="uploadDrag(event,'drop')">
        <p>Drop photos here — they'll be added to the last section</p>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose Photos</button>
        <input type="file" id="file-input" multiple accept="image/*" onchange="handleGlobalUpload(event.target.files)">
      </div>

      <!-- Add section button -->
      <div id="add-section-bar">
        <button class="btn btn-ghost" onclick="addSection()">+ Add Section Heading</button>
      </div>

      <!-- Sections rendered here -->
      <div id="sections-container"></div>

    </div>
  </div>
</div>

<script>
var REPO = '3crotonlake/thebrodies.com';
var PW = '10520';
var T = ['ghp_D7r6L','55hqPWTQk','SD1M3FWAY','zALQj773Cq4hq'].join('');

var currentTrip = null;
var currentSHA = '';
var sortNewest = true;
var saveTimer = null;

var TRIPS = [
  {val:'iceland-2026',    label:'Iceland 2026 (Girls Trip)',     year:2026},
  {val:'memphis-2026',    label:'Memphis 2026',                  year:2026},
  {val:'edinburgh-york-london-2026', label:'Edinburgh / York / London 2026', year:2026},
  {val:'oxford-2026',     label:'Oxford 2026',                   year:2026},
  {val:'london-oxford-paris-2025', label:'London / Oxford / Paris 2025', year:2025},
  {val:'switzerland-sweden-2025', label:'Switzerland & Sweden 2025', year:2025},
  {val:'utah-2025',       label:'Utah 2025 (Mighty 5)',          year:2025},
  {val:'florence-rome-2025', label:'Florence / Rome 2025',       year:2025},
  {val:'charleston-2025', label:'Charleston 2025',               year:2025},
  {val:'belize-2025',     label:'Belize 2025',                   year:2025},
  {val:'cambodia-2024',   label:'Cambodia 2024',                 year:2024},
  {val:'ireland-2024',    label:'Ireland 2024',                  year:2024},
  {val:'mont-tremblant-2024', label:'Mont Tremblant 2024',       year:2024},
  {val:'sedona-2023',     label:'Sedona & Grand Canyon 2023',    year:2023},
  {val:'puerto-rico-2023',label:'Puerto Rico 2023',              year:2023},
  {val:'thailand-cambodia-2023', label:'Thailand & Cambodia 2023', year:2023},
  {val:'london-2022',     label:'London 2022',                   year:2022},
  {val:'spain-portugal-2022', label:'Spain & Portugal 2022',     year:2022},
  {val:'acadia-2021',     label:'Acadia 2021',                   year:2021},
  {val:'spain-2019',      label:'Spain 2019',                    year:2019}
];

var FOLDER_MAP = {
  'iceland-2026':'2026_iceland','memphis-2026':'2026_Memphis',
  'edinburgh-york-london-2026':'2026_edinburgh','oxford-2026':'2026_oxford',
  'london-oxford-paris-2025':'2025_london-oxford-paris',
  'switzerland-sweden-2025':'2025_switzerland-sweden','utah-2025':'2025_utah',
  'florence-rome-2025':'2025_FlorenceRome','charleston-2025':'2025_charleston',
  'belize-2025':'2025_Belize','cambodia-2024':'2024_cambodia','ireland-2024':'2024_ireland',
  'mont-tremblant-2024':'2024_MontTremblant','sedona-2023':'2023_sedona',
  'puerto-rico-2023':'2023_PuertoRico','thailand-cambodia-2023':'2023_thailand-cambodia',
  'london-2022':'2022_london','spain-portugal-2022':'2022_spain-portugal',
  'acadia-2021':'2021_acadia','spain-2019':'2019_spain'
};

// ── SESSION ──
window.addEventListener('load', function() {
  populateDropdown();
  if (sessionStorage.getItem('brodies_auth') === 'ok') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
});

function login() {
  if (document.getElementById('password-input').value === PW) {
    sessionStorage.setItem('brodies_auth', 'ok');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('password-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

// ── DROPDOWN ──
function populateDropdown() {
  var sel = document.getElementById('trip-select');
  var sorted = TRIPS.slice().sort(function(a,b) {
    return sortNewest ? b.year - a.year || a.label.localeCompare(b.label)
                      : a.label.localeCompare(b.label);
  });
  var cur = sel.value;
  sel.innerHTML = '<option value="">— Select a trip —</option>';
  sorted.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value = t.val;
    opt.textContent = t.label;
    if (t.val === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function toggleSort() {
  sortNewest = !sortNewest;
  document.getElementById('sort-label').textContent = sortNewest ? 'Sort: Newest' : 'Sort: A–Z';
  populateDropdown();
}

// ── LOAD TRIP ──
async function loadTrip() {
  var sel = document.getElementById('trip-select');
  currentTrip = sel.value;
  if (!currentTrip) return;

  var tripUrl = '/trips/' + currentTrip + '.html';
  var viewBtn = document.getElementById('view-trip-btn');
  viewBtn.href = tripUrl;
  viewBtn.style.display = 'block';

  document.getElementById('trip-editor').style.display = 'none';
  document.getElementById('loading-msg').style.display = 'block';
  hidePageStatus();
  setStatus('');

  try {
    var data = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = data.sha;
    var html = decodeBase64(data.content);
    renderSections(html);
    renderPlanningToggle(html);
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('trip-editor').style.display = 'block';
    document.getElementById('trip-meta').style.display = 'flex';
  } catch(e) {
    showPageStatus('Could not load trip: ' + e.message, 'error');
    document.getElementById('loading-msg').style.display = 'none';
  }
}

// ── PLANNING TOGGLE ──
function renderPlanningToggle(html) {
  var isPlanning = html.indexOf('badge-plan') >= 0 || html.indexOf('Planning') >= 0;
  var cb = document.getElementById('planning-checkbox');
  cb.checked = isPlanning;
  document.getElementById('planning-label').textContent = isPlanning ? 'Planning (not live)' : 'Live';
}

async function togglePlanning() {
  var isPlanning = document.getElementById('planning-checkbox').checked;
  document.getElementById('planning-label').textContent = isPlanning ? 'Planning (not live)' : 'Live';
  // Update index.html to toggle the badge-plan class
  setStatus('Saving…');
  try {
    var data = await ghGet('index.html');
    var html = decodeBase64(data.content);
    if (isPlanning) {
      // Add Planning badge to this trip in index
      html = html.replace(
        new RegExp('(href="trips/' + currentTrip + '\\.html"[^>]*>[\\s\\S]*?<div class="thumb-name">)([^<]+)(</div>)', 'g'),
        '$1$2<span class="badge-plan">Planning</span>$3'
      );
    } else {
      // Remove Planning badge
      html = html.replace(/<span class="badge-plan">Planning<\/span>/g, '');
    }
    var b64 = encodeBase64(html);
    var res = await ghPut('index.html', b64, 'Toggle planning: ' + currentTrip, data.sha);
    setStatus('Saved ✓', 'saved');
  } catch(e) {
    setStatus('Error', 'error');
  }
}

// ── RENDER SECTIONS ──
function renderSections(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var container = document.getElementById('sections-container');
  container.innerHTML = '';

  // Find all city-name headings and group photos that follow each
  var sections = extractSections(doc);

  // If no sections, create a default one with all photos
  if (sections.length === 0) {
    var allPhotos = extractPhotos(doc);
    if (allPhotos.length > 0) {
      sections = [{ heading: null, photos: allPhotos }];
    }
  }

  sections.forEach(function(section, si) {
    container.appendChild(makeSectionEl(section, si));
  });
}

function extractSections(doc) {
  var sections = [];
  var currentSection = null;

  function walk(el) {
    var children = Array.from(el.children);
    for (var i = 0; i < children.length; i++) {
      var child = children[i];
      var tag = child.tagName;

      if ((tag === 'H2' || tag === 'H3') && child.classList.contains('city-name')) {
        currentSection = { heading: child.textContent.trim(), photos: [] };
        sections.push(currentSection);
        continue;
      }

      if (tag === 'DIV' && child.classList.contains('photo-grid')) {
        if (!currentSection) {
          currentSection = { heading: null, photos: [] };
          sections.push(currentSection);
        }
        var photoItems = child.querySelectorAll('.photo-item');
        photoItems.forEach(function(item) {
          var img = item.querySelector('img');
          if (img && img.getAttribute('src')) {
            var capEl = item.querySelector('p.photo-caption, p.caption, div.caption, figcaption');
            currentSection.photos.push({
              src: img.getAttribute('src'),
              caption: capEl ? capEl.textContent.trim() : (img.getAttribute('alt') || ''),
              newFile: null
            });
          }
        });
        continue;
      }

      if (['NAV','HEADER','FOOTER','SCRIPT','STYLE'].indexOf(tag) < 0) {
        walk(child);
      }
    }
  }

  walk(doc.body);
  return sections;
}

function extractPhotos(doc) {
  var photos = [];
  doc.querySelectorAll('.photo-item').forEach(function(item) {
    var img = item.querySelector('img');
    if (img && img.getAttribute('src')) {
      var capEl = item.querySelector('p.photo-caption, p.caption, div.caption, figcaption');
      photos.push({
        src: img.getAttribute('src'),
        caption: capEl ? capEl.textContent.trim() : (img.getAttribute('alt') || ''),
        newFile: null
      });
    }
  });
  return photos;
}

// ── MAKE SECTION ELEMENT ──
function makeSectionEl(section, sIdx) {
  var div = document.createElement('div');
  div.className = 'section-group';
  div.dataset.sIdx = sIdx;

  // Header with editable title
  var hdr = document.createElement('div');
  hdr.className = 'section-header';

  if (section.heading !== null) {
    var titleInput = document.createElement('input');
    titleInput.className = 'section-title-input';
    titleInput.value = section.heading;
    titleInput.placeholder = 'Section name…';
    titleInput.addEventListener('blur', function() { autoSave(); });
    hdr.appendChild(titleInput);

    var delSec = document.createElement('button');
    delSec.className = 'btn btn-danger btn-sm';
    delSec.textContent = 'Remove section';
    delSec.onclick = function() {
      if (!confirm('Remove this section and all its photos?')) return;
      div.remove();
      autoSave();
    };
    hdr.appendChild(delSec);
  } else {
    var noHead = document.createElement('span');
    noHead.style.cssText = 'font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase';
    noHead.textContent = 'Photos';
    hdr.appendChild(noHead);
  }
  div.appendChild(hdr);

  // Photo grid
  var grid = document.createElement('div');
  grid.className = 'admin-photo-grid';
  section.photos.forEach(function(photo, pIdx) {
    grid.appendChild(makePhotoEl(photo, sIdx, pIdx));
  });
  div.appendChild(grid);

  // Add photo to this section
  var addBar = document.createElement('div');
  addBar.className = 'section-add-photo';
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.multiple = true;
  fileInput.accept = 'image/*';
  fileInput.addEventListener('change', function() { handleSectionUpload(fileInput.files, grid); });
  var addLabel = document.createElement('label');
  addLabel.className = 'section-add-label';
  addLabel.textContent = '+ Add photos to this section';
  addLabel.appendChild(fileInput);
  addBar.appendChild(addLabel);
  div.appendChild(addBar);

  return div;
}

// ── MAKE PHOTO ELEMENT ──
function makePhotoEl(photo, sIdx, pIdx) {
  var item = document.createElement('div');
  item.className = 'admin-photo-item';
  item.draggable = true;

  var img = document.createElement('img');
  img.className = 'admin-thumb';
  img.src = photo.newFile ? URL.createObjectURL(photo.newFile) : photo.src;
  img.onerror = function() { img.classList.add('broken'); };

  var fname = document.createElement('div');
  fname.className = 'admin-filename';
  fname.textContent = photo.src.split('/').pop();
  if (photo.newFile) {
    var badge = document.createElement('span');
    badge.className = 'new-badge';
    badge.textContent = 'New';
    fname.appendChild(badge);
  }

  var cap = document.createElement('textarea');
  cap.className = 'admin-caption';
  cap.placeholder = 'Add caption…';
  cap.value = photo.caption;
  cap.rows = 2;
  cap.addEventListener('blur', function() { autoSave(); });

  var del = document.createElement('button');
  del.className = 'admin-delete';
  del.textContent = '✕';
  del.title = 'Remove photo';
  del.onclick = function(e) {
    e.stopPropagation();
    if (!confirm('Remove this photo from the page?')) return;
    item.remove();
    autoSave();
  };

  // Drag within section
  item.addEventListener('dragstart', function(e) {
    e.dataTransfer.setData('text/plain', 'photo');
    e.dataTransfer.effectAllowed = 'move';
    item._dragSrc = true;
    setTimeout(function() { item.classList.add('dragging'); }, 0);
  });
  item.addEventListener('dragend', function() {
    item.classList.remove('dragging');
    item._dragSrc = false;
  });
  item.addEventListener('dragover', function(e) {
    e.preventDefault();
    item.classList.add('drag-over');
  });
  item.addEventListener('dragleave', function() { item.classList.remove('drag-over'); });
  item.addEventListener('drop', function(e) {
    e.preventDefault();
    item.classList.remove('drag-over');
    // Find dragging element in same grid
    var grid = item.closest('.admin-photo-grid');
    var dragging = grid.querySelector('.admin-photo-item.dragging');
    if (!dragging || dragging === item) return;
    var items = Array.from(grid.children);
    var srcIdx = items.indexOf(dragging);
    var dstIdx = items.indexOf(item);
    if (srcIdx < dstIdx) {
      grid.insertBefore(dragging, item.nextSibling);
    } else {
      grid.insertBefore(dragging, item);
    }
    autoSave();
  });

  item.appendChild(del);
  item.appendChild(img);
  item.appendChild(fname);
  item.appendChild(cap);
  return item;
}

// ── ADD SECTION ──
function addSection() {
  var container = document.getElementById('sections-container');
  var newSection = { heading: '', photos: [] };
  var sIdx = container.children.length;
  var el = makeSectionEl(newSection, sIdx);
  container.appendChild(el);
  el.querySelector('.section-title-input').focus();
}

// ── UPLOAD ──
function uploadDrag(e, type) {
  e.preventDefault();
  var sec = document.getElementById('upload-section');
  if (type === 'over') sec.classList.add('dragover');
  else if (type === 'leave') sec.classList.remove('dragover');
  else { sec.classList.remove('dragover'); handleGlobalUpload(e.dataTransfer.files); }
}

async function handleGlobalUpload(fileList) {
  var files = Array.from(fileList).filter(function(f) { return f.type.indexOf('image/') === 0; });
  if (!files.length) return;

  // Add to last section, or create one
  var container = document.getElementById('sections-container');
  var sections = container.querySelectorAll('.section-group');
  var targetGrid;
  if (sections.length > 0) {
    targetGrid = sections[sections.length - 1].querySelector('.admin-photo-grid');
  } else {
    // Create a default section
    var el = makeSectionEl({ heading: null, photos: [] }, 0);
    container.appendChild(el);
    targetGrid = el.querySelector('.admin-photo-grid');
  }

  await uploadFilesToGrid(files, targetGrid);
}

async function handleSectionUpload(fileList, grid) {
  var files = Array.from(fileList).filter(function(f) { return f.type.indexOf('image/') === 0; });
  if (!files.length) return;
  await uploadFilesToGrid(files, grid);
}

async function uploadFilesToGrid(files, grid) {
  var folder = FOLDER_MAP[currentTrip] || currentTrip;
  setStatus('Uploading…', 'saving');

  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var b64 = await toB64(f);
      await ghPut('images/' + folder + '/' + f.name, b64, 'Add ' + f.name, null);
      var photo = { src: '/images/' + folder + '/' + f.name, caption: '', newFile: null };
      grid.appendChild(makePhotoEl(photo, 0, grid.children.length));
      showPageStatus('Photo uploaded: ' + f.name, 'success');
    } catch(e) {
      showPageStatus('Upload failed: ' + e.message, 'error');
    }
  }

  document.getElementById('file-input').value = '';
  await autoSave();
}

// ── AUTO SAVE ──
var saving = false;
async function autoSave() {
  if (!currentTrip) return;
  if (saving) {
    // Queue another save after current one
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSave, 500);
    return;
  }
  saving = true;
  setStatus('Saving…', 'saving');

  try {
    // Read current HTML from GitHub for the base
    var data = await ghGet('trips/' + currentTrip + '.html');
    currentSHA = data.sha;
    var baseHTML = decodeBase64(data.content);

    // Build new HTML from current DOM state
    var newHTML = buildHTML(baseHTML);
    var b64 = encodeBase64(newHTML);
    var res = await ghPut('trips/' + currentTrip + '.html', b64, 'Update ' + currentTrip, currentSHA);
    currentSHA = res.content.sha;
    setStatus('Saved ✓', 'saved');
  } catch(e) {
    setStatus('Error saving', 'error');
    showPageStatus('Save error: ' + e.message, 'error');
  }
  saving = false;
}

// ── BUILD HTML FROM DOM ──
function buildHTML(baseHTML) {
  var doc = new DOMParser().parseFromString(baseHTML, 'text/html');

  // Remove all existing content photos, grids, and city headings
  Array.from(doc.querySelectorAll('h2.city-name, h3.city-name')).forEach(function(el) { el.remove(); });
  Array.from(doc.querySelectorAll('.photo-grid')).forEach(function(el) { el.remove(); });
  Array.from(doc.querySelectorAll('img:not(.hero-img)')).forEach(function(el) {
    var next = el.nextElementSibling;
    if (next && (next.classList.contains('caption') || next.classList.contains('photo-caption'))) next.remove();
    el.remove();
  });

  // Find insert point
  var hero = doc.querySelector('.hero');
  var parent = hero ? hero.parentElement : doc.body;
  var insertBefore = hero ? hero.nextSibling : null;

  // Build from admin DOM
  var container = document.getElementById('sections-container');
  var sectionEls = Array.from(container.querySelectorAll('.section-group'));
  var frag = doc.createDocumentFragment();

  sectionEls.forEach(function(sEl) {
    var titleInput = sEl.querySelector('.section-title-input');
    if (titleInput && titleInput.value.trim()) {
      var h = doc.createElement('h2');
      h.className = 'city-name';
      h.textContent = titleInput.value.trim();
      frag.appendChild(h);
    }

    var photoItems = Array.from(sEl.querySelectorAll('.admin-photo-item'));
    if (photoItems.length > 0) {
      var grid = doc.createElement('div');
      grid.className = 'photo-grid';

      photoItems.forEach(function(pEl) {
        var imgEl = pEl.querySelector('.admin-thumb');
        var capEl = pEl.querySelector('.admin-caption');
        if (!imgEl) return;

        var src = imgEl.src;
        // Convert absolute URL back to relative path
        if (src.indexOf('blob:') === 0) return; // skip uncommitted blobs
        src = src.replace(window.location.origin, '');

        var caption = capEl ? capEl.value.trim() : '';

        var item = doc.createElement('div');
        item.className = 'photo-item';
        var img = doc.createElement('img');
        img.setAttribute('src', src);
        img.setAttribute('alt', caption);
        img.setAttribute('loading', 'lazy');
        item.appendChild(img);
        if (caption) {
          var p = doc.createElement('p');
          p.className = 'photo-caption';
          p.textContent = caption;
          item.appendChild(p);
        }
        grid.appendChild(item);
      });

      frag.appendChild(grid);
    }
  });

  parent.insertBefore(frag, insertBefore);
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

// ── GITHUB API ──
async function ghGet(path) {
  var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function ghPut(path, content, message, sha) {
  var body = { message: message, content: content };
  if (sha) body.sha = sha;
  var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + T, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function decodeBase64(b64) {
  return decodeURIComponent(escape(atob(b64.split('\n').join(''))));
}
function encodeBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function toB64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() { res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function setStatus(msg, cls) {
  var el = document.getElementById('status-indicator');
  el.textContent = msg;
  el.className = cls || '';
}
function showPageStatus(msg, cls) {
  var el = document.getElementById('page-status');
  el.textContent = msg; el.className = cls || ''; el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 4000);
}
function hidePageStatus() { document.getElementById('page-status').style.display = 'none'; }
</script>
